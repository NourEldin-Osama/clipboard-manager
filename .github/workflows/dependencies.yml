name: Dependencies

# Licenses, security advisories, duplicate versions and where the crates come
# from, with cargo-deny (settings in deny.toml). Runs when the crates change,
# and every Monday: new advisories appear without any change here. Not a
# required check, so it never blocks a pull request or a release.
# Actions are pinned to a commit, with its release in a comment: a tag can
# be moved to other code, a commit can't. Dependabot updates both.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/dependencies.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/dependencies.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs in a Linux container. Unmaintained crates only warn (-W); any
      # other finding fails the job. The container's own Rust is old, so it
      # takes the newest stable first.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: stable
          command-arguments: -W unmaintained
