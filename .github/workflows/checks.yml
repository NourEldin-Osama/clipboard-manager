name: Checks

# Tests and lint for pull requests; no exe and no release (those run on main only).
# Pushes to main run it too, only so that main holds a warm build cache: GitHub
# lets a pull request use caches saved on main, not ones from other pull requests.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache; pull requests just restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # ci/fast-build.toml: no optimisation, no debug info; tests don't need them.
      - name: Test
        run: cargo test --locked --config ci/fast-build.toml
      - name: Lint
        run: cargo clippy --locked --all-targets --config ci/fast-build.toml
