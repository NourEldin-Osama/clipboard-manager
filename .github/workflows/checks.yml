name: Checks

# Format, tests and lint for pull requests; no exe and no release (those run on main only).
# Pushes to main run it too, only so that main holds a warm build cache: GitHub
# lets a pull request use caches saved on main, not ones from other pull requests.
# Actions are pinned to a commit, with its release in a comment: a tag can
# be moved to other code, a commit can't. Dependabot updates both.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Files that aren't code. Keep this list in step with NOT_CODE below and
    # with build-windows.yml.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/dependabot.yml"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/dependencies.yml"
      - "prek.toml"
      - "deny.toml"
      - "tools/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is compared with its base, which needs the history.
          fetch-depth: 0
      # main requires this job on every pull request, so a pull request with
      # only non-code files still runs it, but skips the work and passes.
      - name: Find code changes
        id: changes
        shell: bash
        env:
          NOT_CODE: '^(.*\.md|docs/.*|LICENSE-.*|\.gitignore|\.github/ISSUE_TEMPLATE/.*|\.github/pull_request_template\.md|\.github/dependabot\.yml|\.github/workflows/build-windows\.yml|\.github/workflows/dependencies\.yml|prek\.toml|deny\.toml|tools/.*)$'
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qvE "$NOT_CODE"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only non-code files changed: skipping format, tests and lint."
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: clippy, rustfmt
      # First, because it needs no build and fails in seconds.
      - name: Format
        if: steps.changes.outputs.code == 'true'
        run: cargo fmt --check
      - if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; pull requests just restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # ci/fast-build.toml: no optimisation, no debug info; tests don't need them.
      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: cargo test --locked --config ci/fast-build.toml
      # Warnings fail the check, as in the local hook. A new Rust release can
      # bring new warnings: fix them, then the check passes again.
      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: cargo clippy --locked --all-targets --config ci/fast-build.toml -- -D warnings
