name: Build Windows exe

# Builds main only: each push (a merged pull request included) publishes a
# release with the exe and notes listing the pull requests merged since the
# previous release. Run it by hand from the Actions tab to rebuild main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Builds of main run one after another, so releases come out in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    # A manual run started on another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # to create the release and its tag
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Caches compiled dependencies; later builds only recompile this crate.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Test
        run: cargo test --locked

      - name: Build (dist profile)
        run: cargo build --locked --profile dist

      # e.g. v0.1.0-build.7: the crate version plus this workflow's run number.
      - name: Release name
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          cp target/dist/clipboard-manager.exe clipboard-manager-windows-x64.exe

      - name: Upload exe
        uses: actions/upload-artifact@v6
        with:
          name: clipboard-manager-windows-x64-${{ github.sha }}
          path: clipboard-manager-windows-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Clipboard Manager ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Windows build of `${{ github.sha }}`.

            **Install:** download `clipboard-manager-windows-x64.exe` below and run it. No installer is needed; settings and history are kept in `%APPDATA%\clipboard-manager\data`.
          # Adds "What's Changed": the pull requests merged since the previous release.
          generate_release_notes: true
          files: clipboard-manager-windows-x64.exe
          fail_on_unmatched_files: true
          make_latest: true
