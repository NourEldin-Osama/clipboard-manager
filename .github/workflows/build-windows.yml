name: Build Windows exe

# Builds main only: each push (a merged pull request included) publishes a
# release with the exe and notes listing the pull requests merged since the
# previous release. Run it by hand from the Actions tab to rebuild main.
# Pushes that only touch docs, templates, hooks, tools or check settings don't
# change the exe, so they don't make a release; a push that also changes code
# does. Keep this list in step with checks.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/dependabot.yml"
      - ".github/workflows/checks.yml"
      - "ci/**"
      - "prek.toml"
      - "tools/**"
  workflow_dispatch:

# Builds of main run one after another, so releases come out in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    # A manual run started on another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # to create the release and its tag
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Caches compiled dependencies; later builds only recompile this crate.
      # Caches only the dist build (the tests run in the Checks workflow, on
      # pull requests and on main), under its own key so it stays small and
      # restores quickly.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-dist

      # BUILD_NUMBER goes into the exe, so the app knows which release it is.
      - name: Build (dist profile)
        run: cargo build --locked --profile dist
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # e.g. v0.2.1-build.7: the crate version plus this workflow's run number.
      - name: Release name
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          cp target/dist/clipboard-manager.exe clipboard-manager-windows-x64.exe

      # The app installs an update only if its Ed25519 signature checks out
      # against the public key built into it. The private key is a repo secret.
      # `signed` is the one line newer app versions read every value from, so
      # a changed updater.json can't offer an older exe as new. Older versions
      # read the other fields and check the exe's own signature.
      - name: Sign and describe the update
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY" || { echo "UPDATE_SIGNING_KEY secret is missing"; exit 1; }
          key="$RUNNER_TEMP/update-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          exe=clipboard-manager-windows-x64.exe
          tag="${{ steps.version.outputs.tag }}"
          base="https://github.com/${{ github.repository }}/releases"
          size=$(stat -c %s "$exe")
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          # src/update.rs reads this line, and its tests take the format from here.
          printf 'clipboard-manager-release-v1 version=%s build=%s size=%s sha256=%s url=%s notes_url=%s' \
            "${{ steps.version.outputs.version }}" "${{ github.run_number }}" "$size" "$sha" \
            "$base/download/$tag/$exe" "$base/tag/$tag" > "$RUNNER_TEMP/release.txt"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$exe" -out "$RUNNER_TEMP/exe.sig"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$RUNNER_TEMP/release.txt" -out "$RUNNER_TEMP/release.sig"
          rm -f "$key"
          cat > updater.json <<JSON
          {
            "version": "${{ steps.version.outputs.version }}",
            "build": ${{ github.run_number }},
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes_url": "$base/tag/$tag",
            "url": "$base/download/$tag/$exe",
            "size": $size,
            "sha256": "$sha",
            "signature": "$(base64 -w0 "$RUNNER_TEMP/exe.sig")",
            "signed": "$(cat "$RUNNER_TEMP/release.txt")",
            "signed_signature": "$(base64 -w0 "$RUNNER_TEMP/release.sig")"
          }
          JSON
          cat updater.json

      # Checks what is about to be published: both signatures against the
      # public key built into the app, and that the signed line describes this
      # exe. A signing mistake then stops the release instead of shipping an
      # update that every new version refuses.
      - name: Check the update signatures
        shell: bash
        run: |
          set -euo pipefail
          exe=clipboard-manager-windows-x64.exe
          public=$(sed -n 's/^const PUBLIC_KEY: &str = "\([^"]*\)".*/\1/p' src/update.rs)
          test -n "$public" || { echo "PUBLIC_KEY not found in src/update.rs"; exit 1; }
          # An Ed25519 public key in PEM form: a fixed 12-byte header, then the 32 key bytes.
          pem="$RUNNER_TEMP/update-public.pem"
          {
            echo "-----BEGIN PUBLIC KEY-----"
            { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; printf '%s' "$public" | base64 -d; } | base64 -w0
            echo
            echo "-----END PUBLIC KEY-----"
          } > "$pem"
          # -j prints no line ending: jq.exe on Windows would end lines with CR,
          # which base64 refuses.
          jq -j .signature updater.json | base64 -d > "$RUNNER_TEMP/exe.sig.check"
          openssl pkeyutl -verify -rawin -pubin -inkey "$pem" -in "$exe" -sigfile "$RUNNER_TEMP/exe.sig.check"
          jq -j .signed updater.json > "$RUNNER_TEMP/release.check.txt"
          jq -j .signed_signature updater.json | base64 -d > "$RUNNER_TEMP/release.sig.check"
          openssl pkeyutl -verify -rawin -pubin -inkey "$pem" -in "$RUNNER_TEMP/release.check.txt" -sigfile "$RUNNER_TEMP/release.sig.check"
          grep -q " size=$(stat -c %s "$exe") " "$RUNNER_TEMP/release.check.txt"
          grep -q " sha256=$(sha256sum "$exe" | cut -d' ' -f1) " "$RUNNER_TEMP/release.check.txt"
          echo "Both update signatures check out against the app's public key."

      # Package-manager manifests, attached to each release:
      #   scoop install https://github.com/<repo>/releases/latest/download/clipboard-manager.json
      # and the three winget files, for submitting to microsoft/winget-pkgs.
      - name: Package manifests
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          build="${{ github.run_number }}"
          repo="https://github.com/${{ github.repository }}"
          exe=clipboard-manager-windows-x64.exe
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          url="$repo/releases/download/$tag/$exe"
          cat > clipboard-manager.json <<JSON
          {
            "version": "${tag#v}",
            "description": "Offline clipboard manager: search your history by words or meaning, OCR, tags, pins, English and Arabic.",
            "homepage": "$repo",
            "license": "MIT|Apache-2.0",
            "url": "$url#/clipboard-manager.exe",
            "hash": "$sha",
            "bin": "clipboard-manager.exe",
            "shortcuts": [["clipboard-manager.exe", "Clipboard Manager"]],
            "notes": "The app updates itself. History and settings are kept in your AppData folder (clipboard-manager)."
          }
          JSON
          id=NourEldinOsama.ClipboardManager
          wv="$version.$build"
          mkdir -p winget
          cat > winget/$id.yaml <<YAML
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json

          PackageIdentifier: $id
          PackageVersion: $wv
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.12.0
          YAML
          cat > winget/$id.installer.yaml <<YAML
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

          PackageIdentifier: $id
          PackageVersion: $wv
          InstallerType: portable
          Commands:
            - clipboard-manager
          Installers:
            - Architecture: x64
              InstallerUrl: $url
              InstallerSha256: ${sha^^}
          ManifestType: installer
          ManifestVersion: 1.12.0
          YAML
          cat > winget/$id.locale.en-US.yaml <<YAML
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json

          PackageIdentifier: $id
          PackageVersion: $wv
          PackageLocale: en-US
          Publisher: NourEldin Osama
          PackageName: Clipboard Manager
          PackageUrl: $repo
          License: MIT or Apache-2.0
          LicenseUrl: $repo#license
          ShortDescription: Offline clipboard manager with search by meaning, OCR, tags and pins.
          Tags: [clipboard, clipboard-manager, ocr, semantic-search, arabic]
          ReleaseNotesUrl: $repo/releases/tag/$tag
          ManifestType: defaultLocale
          ManifestVersion: 1.12.0
          YAML
          (cd winget && 7z a -tzip ../winget-manifests.zip . > /dev/null)

      # The per-user installer (installer/clipboard-manager.iss). Its Arabic
      # texts need Inno Setup 6.5 or newer, so the newest one is installed.
      - name: Installer
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DAppBuild=${{ github.run_number }}" `
            "/DSourceExe=..\clipboard-manager-windows-x64.exe" `
            installer\clipboard-manager.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: clipboard-manager-windows-x64-${{ github.sha }}
          path: |
            clipboard-manager-windows-x64.exe
            clipboard-manager-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

      # The notes start with this version's section of CHANGELOG.md.
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > section.md
          {
            if grep -q '[^[:space:]]' section.md; then
              cat section.md
            else
              echo "CHANGELOG.md has no notes for $version yet."
            fi
            echo
            echo '**Install:** download `clipboard-manager-windows-x64-setup.exe` below to install the app for your Windows account, with Start menu and desktop shortcuts and an entry in Installed apps. No administrator rights are needed. Or download `clipboard-manager-windows-x64.exe` and run it without installing. Either way the app updates itself, and settings and history are kept in `%APPDATA%\clipboard-manager\data`.'
            echo
            echo 'Windows build of `${{ github.sha }}`.'
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Clipboard Manager ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body_path: release-notes.md
          # Adds "What's Changed": the pull requests merged since the previous release.
          generate_release_notes: true
          # updater.json is what the app reads from releases/latest/download/.
          files: |
            clipboard-manager-windows-x64.exe
            clipboard-manager-windows-x64-setup.exe
            updater.json
            clipboard-manager.json
            winget-manifests.zip
          fail_on_unmatched_files: true
          make_latest: true
