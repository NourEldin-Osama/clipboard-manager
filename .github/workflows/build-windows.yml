name: Build Windows exe

# Builds main only: each push (a merged pull request included) publishes a
# release with the exe and notes listing the pull requests merged since the
# previous release. Run it by hand from the Actions tab to rebuild main.
# Pushes that only touch docs, templates or check settings don't change the
# exe, so they don't make a release; a push that also changes code does.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/dependabot.yml"
      - ".github/workflows/checks.yml"
      - "ci/**"
  workflow_dispatch:

# Builds of main run one after another, so releases come out in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    # A manual run started on another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # to create the release and its tag
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Caches compiled dependencies; later builds only recompile this crate.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Test
        run: cargo test --locked

      # BUILD_NUMBER goes into the exe, so the app knows which release it is.
      - name: Build (dist profile)
        run: cargo build --locked --profile dist
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # e.g. v0.2.0-build.7: the crate version plus this workflow's run number.
      - name: Release name
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          cp target/dist/clipboard-manager.exe clipboard-manager-windows-x64.exe

      # The app installs an update only if this Ed25519 signature checks out
      # against the public key built into it. The private key is a repo secret.
      - name: Sign and describe the update
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY" || { echo "UPDATE_SIGNING_KEY secret is missing"; exit 1; }
          key="$RUNNER_TEMP/update-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          exe=clipboard-manager-windows-x64.exe
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$exe" -out "$RUNNER_TEMP/exe.sig"
          rm -f "$key"
          tag="${{ steps.version.outputs.tag }}"
          base="https://github.com/${{ github.repository }}/releases"
          cat > updater.json <<JSON
          {
            "version": "${{ steps.version.outputs.version }}",
            "build": ${{ github.run_number }},
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes_url": "$base/tag/$tag",
            "url": "$base/download/$tag/$exe",
            "size": $(stat -c %s "$exe"),
            "sha256": "$(sha256sum "$exe" | cut -d' ' -f1)",
            "signature": "$(base64 -w0 "$RUNNER_TEMP/exe.sig")"
          }
          JSON
          cat updater.json

      # Package-manager manifests, attached to each release:
      #   scoop install https://github.com/<repo>/releases/latest/download/clipboard-manager.json
      # and the three winget files, for submitting to microsoft/winget-pkgs.
      - name: Package manifests
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          build="${{ github.run_number }}"
          repo="https://github.com/${{ github.repository }}"
          exe=clipboard-manager-windows-x64.exe
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          url="$repo/releases/download/$tag/$exe"
          cat > clipboard-manager.json <<JSON
          {
            "version": "${tag#v}",
            "description": "Offline clipboard manager: search your history by words or meaning, OCR, tags, pins, English and Arabic.",
            "homepage": "$repo",
            "license": "MIT|Apache-2.0",
            "url": "$url#/clipboard-manager.exe",
            "hash": "$sha",
            "bin": "clipboard-manager.exe",
            "shortcuts": [["clipboard-manager.exe", "Clipboard Manager"]],
            "notes": "The app updates itself. History and settings are kept in your AppData folder (clipboard-manager)."
          }
          JSON
          id=NourEldinOsama.ClipboardManager
          wv="$version.$build"
          mkdir -p winget
          cat > winget/$id.yaml <<YAML
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json

          PackageIdentifier: $id
          PackageVersion: $wv
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.12.0
          YAML
          cat > winget/$id.installer.yaml <<YAML
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

          PackageIdentifier: $id
          PackageVersion: $wv
          InstallerType: portable
          Commands:
            - clipboard-manager
          Installers:
            - Architecture: x64
              InstallerUrl: $url
              InstallerSha256: ${sha^^}
          ManifestType: installer
          ManifestVersion: 1.12.0
          YAML
          cat > winget/$id.locale.en-US.yaml <<YAML
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json

          PackageIdentifier: $id
          PackageVersion: $wv
          PackageLocale: en-US
          Publisher: NourEldin Osama
          PackageName: Clipboard Manager
          PackageUrl: $repo
          License: MIT or Apache-2.0
          LicenseUrl: $repo#license
          ShortDescription: Offline clipboard manager with search by meaning, OCR, tags and pins.
          Tags: [clipboard, clipboard-manager, ocr, semantic-search, arabic]
          ReleaseNotesUrl: $repo/releases/tag/$tag
          ManifestType: defaultLocale
          ManifestVersion: 1.12.0
          YAML
          (cd winget && 7z a -tzip ../winget-manifests.zip . > /dev/null)

      - name: Upload exe
        uses: actions/upload-artifact@v6
        with:
          name: clipboard-manager-windows-x64-${{ github.sha }}
          path: clipboard-manager-windows-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Clipboard Manager ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Windows build of `${{ github.sha }}`.

            **Install:** download `clipboard-manager-windows-x64.exe` below and run it. No installer is needed; settings and history are kept in `%APPDATA%\clipboard-manager\data`.
          # Adds "What's Changed": the pull requests merged since the previous release.
          generate_release_notes: true
          # updater.json is what the app reads from releases/latest/download/.
          files: |
            clipboard-manager-windows-x64.exe
            updater.json
            clipboard-manager.json
            winget-manifests.zip
          fail_on_unmatched_files: true
          make_latest: true
