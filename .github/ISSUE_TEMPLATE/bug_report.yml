name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check the [open issues](https://github.com/NourEldin-Osama/clipboard-manager/issues) first.
  - type: input
    id: version
    attributes:
      label: Version
      description: "Settings → General → Updates → Version, e.g. 0.2.0 (build 12)."
      placeholder: 0.2.0 (build 12)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy …
        2. Search for …
        3. …
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Settings → Data & privacy → Log file → Show. Paste the relevant lines (remove anything private)."
      render: text
