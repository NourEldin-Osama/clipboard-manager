[package]
name = "clipboard-manager"
version = "0.4.0"
edition = "2021"
description = "Offline clipboard history with on-device OCR and semantic (embedding) search for text and images."
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
arboard = "3.7"
auto-launch = "0.6"
base64 = "0.23"
# candle from its code on GitHub, at a fixed commit: release 0.11.0 needs
# tokenizers 0.22 with the onig C library, a second tokenizers next to ours.
# Back to a crates.io release once one comes out after 0.11.0.
candle-core = { git = "https://github.com/huggingface/candle", rev = "12bb5d1f6350f4ea9827d9086f213feec1f0af6a" }
candle-nn = { git = "https://github.com/huggingface/candle", rev = "12bb5d1f6350f4ea9827d9086f213feec1f0af6a" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow", "persistence", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# Verifying downloaded updates (signature and checksum).
ed25519-dalek = { version = "3", default-features = false }
# Renders the SVG icons in assets/icons.
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
# The interface texts in locales/ (Project Fluent).
fluent-bundle = "0.16"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
log = "0.4"
env_logger = "0.11"
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
redb = "4.4"
# Encrypts the history (AES-256-GCM) and makes its key; already built in for HTTPS.
ring = "0.17"
rfd = "0.17"
# The patterns of rules per app; already built in for logging.
regex = "1"
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
# ksni: the Linux tray talks D-Bus directly instead of needing GTK.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# Orders mixed Arabic/Latin text for display; egui lays runs out left to right.
unicode-bidi = "0.3"
tokenizers = { version = "0.23", default-features = false, features = ["unstable_wasm"] }
# The language tags fluent-bundle takes.
unic-langid = "0.9"
ureq = { version = "3", features = ["json"] }
walkdir = "2"

[dev-dependencies]
# Reads the locales/*.ftl files in the text tests.
fluent-syntax = "0.12"

# Embeds the app icon and file details in the Windows exe (see build.rs).
[build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
# DPAPI, which encrypts API keys for the signed-in Windows user (secure.rs),
# the named mutex and event that keep one running copy (single_instance.rs),
# pasting into another program (paste.rs) and placing the popup (screen.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# Reads the sign-in entry without turning it on (autostart.rs); auto-launch uses it too.
windows-registry = "0.6"
# Windows' own text reader for images (ocr/windows_reader.rs). Other crates already
# build this version.
windows = { version = "0.62", features = ["Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }

# Everyday release builds: no LTO and many codegen units, so rebuilding after a
# change takes a fraction of the time.
[profile.release]
opt-level = 3
codegen-units = 16
strip = true

# Shipping build (smaller, slightly faster binary): cargo build --profile dist
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 4

[profile.dev]
debug = "line-tables-only"

# Dependencies get light optimisation in debug builds (quick to compile)...
[profile.dev.package."*"]
opt-level = 1

# ...except the number-crunching ones: model inference, OCR and image decoding
# are unusably slow without full optimisation.
[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.gemm]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f16]
opt-level = 3

[profile.dev.package.gemm-f32]
opt-level = 3

[profile.dev.package.pulp]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package.rten-base]
opt-level = 3

[profile.dev.package.rten-gemm]
opt-level = 3

[profile.dev.package.rten-imageproc]
opt-level = 3

[profile.dev.package.rten-simd]
opt-level = 3

[profile.dev.package.rten-tensor]
opt-level = 3

[profile.dev.package.rten-vecmath]
opt-level = 3

[profile.dev.package.ocrs]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
